<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8DB8"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F1F33" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- One person with a shield and a tick: the account, and that it is
       verified and looked after. The person alone would be every user icon;
       the shield is what the addon adds (verification, the grace period, the
       data export). One figure, where Teams draws a group.

       Steel blue, greyer than Entitlements' and Inline Edit's saturated
       blues, because an account page should feel calm rather than loud. -->
  <g filter="url(#sh)" fill="#FFFFFF">
    <circle cx="212" cy="174" r="78"/>
    <path d="M80 424 C80 336 140 284 212 284 C284 284 344 336 344 424 Q344 440 328 440 L96 440 Q80 440 80 424 Z"/>
  </g>

  <!-- the shield, cut free of the body by a ring in the background colour,
       or at 24 pixels the two merge into one blob -->
  <path d="M372 258 L450 288 V350 C450 402 416 438 372 456 C328 438 294 402 294 350 V288 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="28" stroke-linejoin="round"/>
  <path d="M372 258 L450 288 V350 C450 402 416 438 372 456 C328 438 294 402 294 350 V288 Z" fill="#FFFFFF" filter="url(#sh)"/>
  <path d="M338 356 L362 380 L406 334" stroke="url(#bg)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
