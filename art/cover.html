<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #25466B 0%, #142840 55%, #060B12 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #D6E4F2; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #7FA9D4; box-shadow: 0 0 18px #7FA9D4; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#D6E4F2,#9CC0E3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #DCE4EC; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #D6E4F2; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #5B8DB847, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Accounts</span></h1>
      <p class="sub">Email verification, email change, account deletion with a grace period, a personal data export and a customer overview.</p>
      <div class="badges">
        <span class="badge">Verified email</span>
        <span class="badge">Grace period</span>
        <span class="badge">Data export</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5B8DB8"/><stop offset="1" stop-color="#1E3A5F"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F1F33" flood-opacity="0.36"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- one person with a verified shield, see icon.svg -->
        <g filter="url(#sh)" fill="#FFFFFF">
          <circle cx="212" cy="174" r="78"/>
          <path d="M80 424 C80 336 140 284 212 284 C284 284 344 336 344 424 Q344 440 328 440 L96 440 Q80 440 80 424 Z"/>
        </g>
        <path d="M372 258 L450 288 V350 C450 402 416 438 372 456 C328 438 294 402 294 350 V288 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="28" stroke-linejoin="round"/>
        <path d="M372 258 L450 288 V350 C450 402 416 438 372 456 C328 438 294 402 294 350 V288 Z" fill="#FFFFFF" filter="url(#sh)"/>
        <path d="M338 356 L362 380 L406 334" stroke="url(#bg)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
